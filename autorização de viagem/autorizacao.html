<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Autorização</title>
    <style>
        body { font-family: 'Times New Roman', serif; padding: 40px; background: #fff; }
        article { border: 2px solid #333; padding: 40px; max-width: 700px; margin: auto; }
        header { text-align: center; margin-bottom: 30px; }
        h1 { text-decoration: underline; font-size: 1.8rem; }
        p { text-align: justify; line-height: 1.8; font-size: 1.1rem; }
        .dado-preenchido { font-weight: bold; text-transform: uppercase; }
        footer { margin-top: 60px; text-align: center; }
        .linha { border-top: 1px solid #000; width: 250px; margin: 10px auto; }
    </style>
</head>
<body>
    <article>
        <header>
            <h1>AUTORIZAÇÃO</h1>
        </header>

        <section id="conteudo-documento">
            <p>
                Eu sr(a)  
                <span id="nomeR" class="dado-preenchido"></span>, 
                permito que o aluno <span id="nome" class="dado-preenchido"></span>, 
                portador do CPF <span id="cpf" class="dado-preenchido"></span>, 
                com idade de <span id="idade" class="dado-preenchido"></span> anos,
                que irá jogar na modalidade <span id="modalidades" class="dado-preenchido"></span>, 
                na categoria <span id="categoria" class="dado-preenchido"></span>.
                O aluno partirá da cidade <span id="cidadeO" class="dado-preenchido"></span>, 
                com destino a cidade <span id="cidadeD" class="dado-preenchido"></span>.
                
            </p>
            <p>
                O não comparecimento na data estipulada poderá acarretar consequências.
            </p>
        </section>

        <footer>
            <div class="linha"></div>
            <p>Departamento de esporte federal</p>
        </footer>
    </article>

    <script>
        window.onload = function() {
            const urlParams = new URLSearchParams(window.location.search);
            
            // Atribuição semântica dos dados capturados
            document.getElementById('nome').textContent = urlParams.get('nome');
            document.getElementById('cpf').textContent = urlParams.get('cpf');
            document.getElementById('idade').textContent = urlParams.get('idade');
            document.getElementById('cidadeO').textContent = urlParams.get('cidadeO');
            document.getElementById('cidadeD').textContent = urlParams.get('cidadeD');
            document.getElementById('modalidades').textContent = urlParams.get('modalidades');
            document.getElementById('nomeR').textContent = urlParams.get('nomeR');
            document.getElementById('categoria').textContent = urlParams.get('categoria');
        }
    </script>
</body>
</html>
