<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <h1>Formar sigla</h1>
</head>
<body>
    <label for="inputA">Digite uma frase:</label>
    <input type="text" id="inputA">
    <br>
    <br>
    <input type="button" value="escrever" onclick="funcaoexecutar()">
    <br>
    <br>
    <label for="resp">Resposta:</label>
    <span id="resp"></span>
    <script>
        function funcaoexecutar() {
            let frase = document.getElementById("inputA").value;
            let palavra = frase.split(" ");
            let sigla = "";
            document.getElementById("resp").innerHTML = "";
            for (let i = 0; i < palavra.length; i++) {
                    sigla += palavra[i][0];
            }
            document.getElementById("resp").innerHTML = sigla.toUpperCase();
        }
    </script>
</body>
</html>
