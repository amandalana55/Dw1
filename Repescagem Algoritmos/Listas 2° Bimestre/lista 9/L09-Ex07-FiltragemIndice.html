<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <h1>Formar novas palavras com indíce par</h1>
</head>
<body>
    <label for="inputA">Digite uma palavra:</label>
    <input type="text" id="inputA">
    <br>
    <br>
    <input type="button" value="escrever" onclick="funcaoexecutar()">
    <br>
    <br>
    <label for="resp">Resposta:</label>
    <span id="resp"></span>
    <script>
        function funcaoexecutar() {
            let palavra = document.getElementById("inputA").value;
            let novaPalavra = "";
            document.getElementById("resp").innerHTML = "";
            for (let i = 0; i < palavra.length; i++) {
                if (i%2==0){
                    novaPalavra += palavra[i];
                }
            }
            document.getElementById("resp").innerHTML = novaPalavra;
        }
    </script>
</body>
</html>
