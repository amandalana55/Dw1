<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <h1>Substituir letras por maiusculas e minusculas</h1>
</head>
<body>
    <label for="inputA">Digite uma frase (alterne em maiusculas e minusculas):</label>
    <input type="text" id="inputA">
    <br>
    <br>
    <input type="button" value="escrever" onclick="funcaoexecutar()">
    <br>
    <br>
    <label for="resp">Resposta:</label>
    <span id="resp"></span>
    <script>
        function funcaoexecutar() {
            let frase = document.getElementById("inputA").value;
            let novafrase= "";
            document.getElementById("resp").innerHTML = "";
            for (let i = 0; i < frase.length; i++) {
                if(frase[i]==frase[i].toLowerCase()){
                   novafrase += frase[i].toUpperCase();
                }else if (frase[i]==frase[i].toUpperCase()){
                   novafrase += frase[i].toLowerCase();
                }
            }
            document.getElementById("resp").innerHTML= novafrase;
        }
    </script>
</body>

</html>
