<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <h1>contar consoantes</h1>
</head>
<body>
    <label for="inputA">Digite uma palavra:</label>
    <input type="text" id="inputA">
    <br>
    <br>
    <input type="button" value="escrever" onclick="funcaoexecutar()">
    <br>
    <br>
    <label for="resp">Quatidade de consoantes:</label>
    <span id="resp"></span>
    <script>
        function funcaoexecutar() {
            let palavra = document.getElementById("inputA").value.toLowerCase();
            let contador = 0;
            document.getElementById("resp").innerHTML = "";
            for (let i = 0; i < palavra.length; i++) {
                if (palavra[i] != 'a' && palavra[i] != 'e' && palavra[i] != 'i' && palavra[i] != 'o' && palavra[i] != 'u'  && palavra[i] != " ") {
                    contador++;
                }
            }
            document.getElementById("resp").innerHTML = contador;
        }
    </script>
</body>
</html>
