<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <h1>Tabuada</h1>
</head>
<body>
    <label for="inputA">Digite um número:</label>
    <input type="number" id="inputA">
    <br>
    <br>
    <input type="button" value="escrever" onclick="funcaoexecutar()">
    <br>
    <br>
    <label for="resp">Resposta:</label>
    <span id="resp"></span>
    <script>
        function funcaoexecutar() {
            let numero = parseFloat(document.getElementById("inputA").value);
            let resultado = 0;
            document.getElementById("resp").innerHTML = "";
            if(numero<=0){
                alert("número inválido")
            }
            for (let i = 0; i <= 10; i++) {
                resultado = numero * i
                document.getElementById("resp").innerHTML+= numero + " X " + i + " = " + resultado + "<br>";
            }
        }
    </script>
</body>
</html>
