<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <h1>Cálculo de crescimento</h1>
</head>
<body>
    <input type="button" value="escrever" onclick="funcaoexecutar()">
    <br>
    <br>
    <label for="resp">Resposta:</label>
    <span id="resp"></span>
    <script>
        function funcaoexecutar() {
            let seguidores = 0;
            document.getElementById("resp").innerHTML = "";
            for (let i = 1; i <= 30; i++) {
                seguidores += 5
                document.getElementById("resp").innerHTML+= " Dia " + i + " seguidores: " + seguidores + "<br>";
            }
        }
    </script>
</body>
</html>
