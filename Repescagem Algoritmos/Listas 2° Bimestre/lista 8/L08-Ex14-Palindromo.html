<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <h1>Palíndromo</h1>
</head>
<body>
    <label for="inputA">Digite uma palavra:</label>
    <input type="text" id="inputA">
    <br>
    <br>
    <input type="button" value="escrever" onclick="funcaoexecutar()">
    <br>
    <br>
    <label for="resp">Resposta:</label>
    <span id="resp"></span>
    <script>
        function funcaoexecutar() {
            let palavra = document.getElementById("inputA").value;
            let invertida = "";
            document.getElementById("resp").innerHTML = "";
            for (let i = palavra.length - 1; i >= 0; i--) {
                invertida += palavra[i];

            }
            for (let j = 0; j < palavra.length-1; j++) {
                if(palavra[j]!=invertida[j]){
                    document.getElementById("resp").innerHTML= "Não é palíndromo";
                }else{
                   document.getElementById("resp").innerHTML= "É palíndromo"; 
                }
                
            }
        }
    </script>
</body>
</html>
