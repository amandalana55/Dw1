<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <h1>Palavra invertida no while</h1>
</head>
<body>
    <label for="inputA">Digite uma palvra:</label>
    <input type="text" id="inputA">
    <br>
    <br>
    <input type="button" value="escrever" onclick="funcaoexecutar()">
    <br>
    <br>
    <label for="resp">Palavra invertida:</label>
    <span id="resp"></span>
    <script>
        function funcaoexecutar() {
            let palavra = document.getElementById("inputA").value;
            let invertida = "";
            let i = palavra.length-1;
            while(i >= 0 ){
                invertida += palavra[i];
                i--;
            }
            document.getElementById("resp").innerHTML = invertida ;
        }
    </script>
</body>
</html>
