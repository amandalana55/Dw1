<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <h1>Inversão de Vetor</h1>
</head>
<body>
    <label>Digite os números separados por espaço:</label>
    <input type="text" id="inputA">
    <br>
    <br>
    <input type="button" value="Inverter com FOR" onclick="inverterFor()">
    <input type="button" value="Inverter com WHILE" onclick="inverterWhile()">
    <br>
    <br>
    <label>Resposta:</label>
    <span id="resp"></span>
    <script>
        function inverterFor() {
            let vetor = document.getElementById("inputA").value.split(" ");
            let inverso = "";
            for (let i = vetor.length - 1; i >= 0; i--) {
                inverso += vetor[i] + " ";
            }
            document.getElementById("resp").innerHTML = inverso;
        }
        function inverterWhile() {
            let vetor = document.getElementById("inputA").value.split(" ");
            let inverso = "";
            let i = vetor.length - 1;
            while (i >= 0) {
                inverso += vetor[i] + " ";
                i--;
            }
            document.getElementById("resp").innerHTML = inverso;
        }
    </script>
</body>
</html>
