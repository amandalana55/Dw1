<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <h1>Retirar números repetidos</h1>
</head>
<body>
    <label for="inputA">Digite números:</label>
    <input type="text" id="inputA">
    <br>
    <br>
    <input type="button" value="verificar" onclick="funcaoexecutar()">
    <br>
    <br>
    <label for="resp">Resposta:</label>
    <span id="resp"></span>
    <script>
        function funcaoexecutar() {
         let numeros = document.getElementById("inputA").value;
         let novovetor= [];
            document.getElementById("resp").innerHTML = "";
        for (let i = 0; i < numeros.length; i++) {
             let repetida = false;
        for (let j = 0; j < novovetor.length; j++) {
        if (numeros[i] == novovetor[j]) {
            repetida = true;
        }
     }
        if (repetida == false) {
        novovetor.push(numeros[i]);
     }
 }
       document.getElementById("resp").innerHTML= novovetor;
 }
    </script>
</body>

</html>
