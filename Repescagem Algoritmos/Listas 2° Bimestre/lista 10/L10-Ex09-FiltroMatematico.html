<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <h1>Contagem de números ímpares até 500</h1>
</head>
<body>
    <input type="button" value="contar" onclick="funcaoexecutar()">
    <br>
    <br>
    <label for="resp">Soma:</label>
    <span id="resp"></span>
    <script>
        function funcaoexecutar() {
            let soma= 0;
            document.getElementById("resp").innerHTML = "";
            for (let i = 1; i <= 500; i++) {
                if (i % 2 != 0 && i % 3 == 0) {
                    soma+= i;
                } 
            }
             document.getElementById("resp").innerHTML = soma;
        }
    </script>
</body>

</html>
